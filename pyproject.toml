[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lidar-strip-adjust"
version = "0.1.0"
description = "Automated boresight calibration and strip adjustment for airborne/UAV LiDAR point clouds"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Daud Tasleem", email = "daudtasleem215@gmail.com" }]
keywords = ["lidar", "point-cloud", "boresight", "strip-adjustment", "calibration", "remote-sensing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "laspy>=2.5",
    "scikit-learn>=1.3",
    "tqdm>=4.65",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-benchmark>=4.0",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.8",
    "pip-audit>=2.6",
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
]

[project.scripts]
lidar-strip-adjust = "lidar_strip_adjust.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lidar_strip_adjust"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "ANN"]
ignore = ["ANN101", "ANN102", "N806"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "B905"]
"benchmark/**" = ["ANN", "N806", "E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
packages = ["lidar_strip_adjust"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
